apply plugin: 'com.android.application'

android {
    namespace = "com.themazzy.cookingapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.themazzy.cookingapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The app's own key, kept out of the repo: CI writes it from the
    // ANDROID_KEYSTORE_BASE64 secret, so each build installs as an update and
    // keeps the app's data and logins. Without it (a local build) Android
    // Studio's own debug key is used, which can't update the installed app.
    def appKeystore = file('cookingapp.keystore')
    def appKeyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    signingConfigs {
        app {
            storeFile appKeystore
            storePassword appKeyPassword
            keyAlias 'cookingapp'
            keyPassword appKeyPassword
        }
    }
    buildTypes {
        debug {
            if (appKeystore.exists() && appKeyPassword) signingConfig signingConfigs.app
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // On-device text recognition for recipe photos (Latin script). The model
    // comes through Google Play services instead of inside the app (~20 MB less)
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
    // Recipe translation: language detection from Play services and Gemini Nano
    // through AICore (its model is on the phone, not in the APK)
    implementation "com.google.android.gms:play-services-mlkit-language-id:17.0.0"
    implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
    // Product barcodes for the pantry: Google's code scanner, whose camera
    // screen and model also come from Play services (no camera permission)
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

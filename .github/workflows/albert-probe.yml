name: Albert probe
on:
  push:
    branches: [claude/project-thread-wmv5z3]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe/albert.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B albert-probe
          git add -f probe
          git commit -m probe
          git push -f origin albert-probe

# Finds candidate ingredient photos on Wikimedia Commons and saves them to the
# photo-candidates branch, so they can be reviewed and picked for the catalog.
name: Find ingredient photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/find-meat-photos.mjs
      - name: Save to the photo-candidates branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B photo-candidates
          git add photo-candidates
          git commit -m "Ingredient photo candidates from Wikimedia Commons"
          git push -f origin photo-candidates
